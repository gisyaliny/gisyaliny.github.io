    <path d="M66 114l10-27 18 6 20-39" fill="none" stroke="#f3bd3b" stroke-width="3"/>
    <g fill="#ffd15f"><circle cx="66" cy="114" r="3.7"/><circle cx="76" cy="87" r="3.7"/><circle cx="94" cy="93" r="3.7"/><circle cx="114" cy="54" r="3.7"/></g>
